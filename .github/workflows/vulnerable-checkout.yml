name: Defence 1 - Safe PR Checkout

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  Defence-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run code from pull request
        run: |
          echo "Running code from the pull request..."
          if [ -f demo.sh ]; then
            bash demo.sh
          fi
