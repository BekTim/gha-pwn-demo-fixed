name: Attack 2 - PR Title Injection

on:
  pull_request_target:
    types: [opened, edited, reopened]

permissions:
  contents: read

jobs:
  title-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Process untrusted PR title
        run: |
          echo "PR title: ${{ github.event.pull_request.title }}"

      - name: Finish demonstration
        run: |
          echo "Attack 2 workflow completed."
