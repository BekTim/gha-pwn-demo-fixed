name: Defence 2 - PR Title Injection

on:
  pull_request:
    types: [opened, edited, reopened]

permissions:
  {}

jobs:
  title-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Process untrusted PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Pull request title: $PR_TITLE"

      - name: Finish demonstration
        run: |
          echo "Defence 2 workflow completed."
